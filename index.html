<!DOCTYPE html>
<html lang="en">
<head>
  <!-- VIBE CONFIGURATION -->
  <script>
    const SUPABASE_URL = "https://gxfhzqtlcexneuonrryl.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_EvJ8SO7DdOMKCNXenpxwBA_SXqO1jWl"</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#313338">
  <title>Vibe</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #313338;
      --sidebar: #2b2d31;
      --servers: #1e1f22;
      --panel: #232428;
      --hover: #3f4147;
      --text: #f2f3f5;
      --muted: #949ba4;
      --purple: #5865f2;
      --green: #23a559;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
    }

    button, input { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
    }

    .hidden { display: none !important; }

    #auth {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at top right, #5865f255, transparent 45%),
        #1e1f22;
      overflow-y: auto;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: #313338;
      border-radius: 10px;
      box-shadow: 0 12px 45px #0005;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      text-align: center;
      color: white;
      margin-bottom: 8px;
    }

    .logo span { color: #8992ff; }

    .subtitle {
      color: var(--muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #b5bac1;
      margin: 14px 0 7px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 0;
      outline: 0;
      color: white;
      background: #1e1f22;
      padding: 12px;
      border-radius: 5px;
    }

    input:focus { box-shadow: 0 0 0 1px var(--purple); }

    .primary {
      background: var(--purple);
      color: white;
      padding: 12px;
      border-radius: 5px;
      font-weight: bold;
      width: 100%;
      margin-top: 12px;
    }

    .primary:hover { background: #4752c4; }

    .secondary {
      color: #c7c9ce;
      background: transparent;
      padding: 10px;
      width: 100%;
      margin-top: 5px;
    }

    #status {
      color: #c7c9ce;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      margin: 10px 0;
    }

    #app {
      display: grid;
      grid-template-columns: 70px 240px minmax(0, 1fr);
      width: 100%;
      height: 100dvh;
    }

    #serverRail {
      background: var(--servers);
      padding: 12px 0;
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 9px;
      overflow-y: auto;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      min-height: 48px;
      border-radius: 50%;
      background: #313338;
      color: #dbdee1;
      font-size: 19px;
      font-weight: bold;
      display: grid;
      place-items: center;
      transition: border-radius .15s, background .15s;
      position: relative;
    }

    .server-icon:hover,
    .server-icon.selected {
      border-radius: 16px;
      background: var(--purple);
      color: white;
    }

    .server-icon.selected::before {
      content: "";
      position: absolute;
      left: -11px;
      width: 4px;
      height: 32px;
      border-radius: 0 5px 5px 0;
      background: white;
    }

    .rail-divider {
      width: 32px;
      height: 2px;
      background: #35363c;
    }

    #side {
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .server-heading {
      padding: 17px 15px;
      font-weight: bold;
      border-bottom: 1px solid #202126;
      box-shadow: 0 2px 4px #0002;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .side-scroll {
      padding: 12px 8px;
      overflow-y: auto;
      flex: 1;
    }

    .category {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 10px 6px 5px;
    }

    .small-add {
      color: var(--muted);
      background: transparent;
      font-size: 20px;
      padding: 0 5px;
    }

    .side-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px;
      margin: 2px 0;
      color: var(--muted);
      background: transparent;
      text-align: left;
      border-radius: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .side-item:hover {
      background: var(--hover);
      color: #dbdee1;
    }

    .side-item.selected {
      background: #404249;
      color: white;
    }

    .user-panel {
      padding: 10px;
      background: #232428;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 50%;
      background: var(--purple);
      display: grid;
      place-items: center;
      font-weight: bold;
    }

    .user-info {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      overflow: hidden;
    }

    .user-info strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-info span { color: var(--muted); }

    .logout-btn {
      color: var(--muted);
      background: transparent;
      padding: 7px;
    }

    #chat {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    #chatHeader {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid #26272d;
      box-shadow: 0 2px 4px #0001;
      font-weight: bold;
    }

    .hash {
      color: var(--muted);
      font-size: 24px;
    }

    #chatHeader small {
      margin-left: auto;
      color: var(--muted);
      font-weight: normal;
      font-size: 12px;
    }

    #welcome {
      margin: auto;
      text-align: center;
      color: var(--muted);
      padding: 25px;
    }

    #welcome .big-hash {
      font-size: 70px;
      font-weight: bold;
      color: #42444b;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      min-height: 0;
    }

    .message {
      display: flex;
      gap: 12px;
      padding: 8px 4px;
      border-radius: 5px;
    }

    .message:hover { background: #2e3035; }

    .message .avatar { margin-top: 1px; }

    .message-body { min-width: 0; flex: 1; }

    .message-top {
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .message-top strong { font-size: 14px; }

    .message-top time {
      color: var(--muted);
      font-size: 11px;
    }

    .message-text {
      margin-top: 4px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #composer-wrap { padding: 0 16px 22px; }

    #composer {
      background: #383a40;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
    }

    #messageInput {
      background: transparent;
      padding: 10px 5px;
      min-width: 0;
    }

    #send {
      flex: 0 0 42px;
      height: 38px;
      background: var(--purple);
      color: white;
      border-radius: 6px;
      font-size: 18px;
    }

    #send:disabled { opacity: .5; }

    .empty-note {
      padding: 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (max-width: 650px) {
      #app {
        grid-template-columns: 56px minmax(105px, 32vw) minmax(0, 1fr);
      }

      .server-icon {
        width: 40px;
        height: 40px;
        min-height: 40px;
      }

      .server-heading { padding: 16px 8px; font-size: 13px; }
      .side-scroll { padding: 8px 5px; }
      .side-item { padding: 8px 5px; font-size: 12px; }
      #chatHeader { padding: 0 10px; }
      #chatHeader small { display: none; }
      #messages { padding: 10px 7px; }
      #composer-wrap { padding: 0 7px 10px; }
      .message { gap: 7px; }
      .message .avatar { width: 28px; height: 28px; flex-basis: 28px; }
      .message-top strong { font-size: 12px; }
      .message-text { font-size: 13px; }
    }

    @media (max-width: 390px) {
      #app { grid-template-columns: 48px 100px minmax(0, 1fr); }
      .server-icon { width: 36px; height: 36px; min-height: 36px; }
      .user-info { display: none; }
      .logout-btn { font-size: 11px; }
    }
  </style>
</head>

<body>
  <section id="auth">
    <div class="login-card">
      <div class="logo">V<span>ibe</span></div>
      <div class="subtitle">Your people. Your places. Your vibe.</div>

      <label class="field-label" for="username">Username (for sign-up)</label>
      <input id="username" maxlength="20" placeholder="Choose a username">

      <label class="field-label" for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

      <label class="field-label" for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters">

      <button class="primary" id="signup">Create Account</button>
      <button class="secondary" id="login">Already have an account? Log in</button>
      <p id="status">Welcome to Vibe!</p>
    </div>
  </section>

  <div id="app" class="hidden">
    <aside id="serverRail">
      <button class="server-icon selected" title="Vibe home" onclick="homeView()">V</button>
      <div class="rail-divider"></div>
      <div id="serverIcons"></div>
      <button class="server-icon" title="Create server" id="railAdd">+</button>
    </aside>

    <aside id="side">
      <div class="server-heading" id="serverHeading">Vibe Home</div>

      <div class="side-scroll">
        <div class="category">Your servers</div>
        <div id="servers"></div>

        <button class="side-item" id="sideAdd">＋ Create a server</button>

        <div class="category">
          <span>Text channels</span>
          <button class="small-add" id="channelAdd" title="Create channel">＋</button>
        </div>

        <div id="channels"></div>
        <p class="empty-note" id="sideHint">Create a server to start your community.</p>
      </div>

      <div class="user-panel">
        <div class="avatar" id="myAvatar">V</div>
        <div class="user-info">
          <strong id="myName">Vibe user</strong>
          <span>Online</span>
        </div>
        <button class="logout-btn" id="logout" title="Log out">↪</button>
      </div>
    </aside>

    <main id="chat">
      <div id="chatHeader">
        <span class="hash">#</span>
        <span id="chatTitle">Welcome to Vibe</span>
        <small>Make yourself at home ✨</small>
      </div>

      <div id="welcome">
        <div class="big-hash">#</div>
        <h2>Welcome to Vibe!</h2>
        <p>Choose a server and channel to start chatting.</p>
      </div>

      <div id="messages" class="hidden"></div>

      <div id="composer-wrap" class="hidden">
        <div id="composer">
          <input id="messageInput" maxlength="2000" placeholder="Message #channel">
          <button id="send" title="Send message">➤</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const say = message => $("status").textContent = message;

    let db = null;
    let user = null;
    let currentServer = null;
    let currentChannel = null;
    let messageSubscription = null;
    let busy = false;

    function setBusy(value) {
      busy = value;
      ["signup", "login", "send"].forEach(id => $(id).disabled = value);
    }

    async function run(action) {
      if (busy) return;
      setBusy(true);
      try { await action(); }
      catch (error) { say(error.message || "Something went wrong."); }
      finally { setBusy(false); }
    }

    function initials(name) {
      return (name || "V").trim().slice(0, 1).toUpperCase();
    }

    function homeView() {
      currentServer = null;
      currentChannel = null;
      $("serverHeading").textContent = "Vibe Home";
      $("chatTitle").textContent = "Welcome to Vibe";
      $("channels").replaceChildren();
      $("messages").classList.add("hidden");
      $("composer-wrap").classList.add("hidden");
      $("welcome").classList.remove("hidden");
      $("welcome").innerHTML =
        "<div class='big-hash'>V</div><h2>Welcome to Vibe!</h2><p>Choose a server and channel to start chatting.</p>";
    }

    function showAuth() {
      $("auth").classList.remove("hidden");
      $("app").classList.add("hidden");
    }

    function showApp() {
      $("auth").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("myName").textContent = user.email.split("@")[0];
      $("myAvatar").textContent = initials(user.email);
      loadServers();
    }

    const configured =
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("/rest/v1") &&
      !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_") &&
      SUPABASE_PUBLISHABLE_KEY.length > 10;

    if (!configured) {
      say("Add your Supabase publishable key at the top of this file.");
    } else if (!window.supabase) {
      say("Supabase could not load. Check your internet connection.");
    } else {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      start();
    }

    async function start() {
      const { data, error } = await db.auth.getSession();
      if (error) { say(error.message); return; }

      if (data.session) {
        user = data.session.user;
        showApp();
      } else {
        showAuth();
      }

      db.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_IN" && session) {
          user = session.user;
          showApp();
        }
        if (event === "SIGNED_OUT") {
          user = null;
          showAuth();
        }
      });
    }

    $("signup").onclick = () => run(async () => {
      const username = $("username").value.trim();
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        say("Username must be 3–20 letters, numbers, or underscores.");
        return;
      }
      if (!email || password.length < 8) {
        say("Enter your email and a password of at least 8 characters.");
        return;
      }

      say("Creating your account...");
      const { data, error } = await db.auth.signUp({
        email, password,
        options: { data: { username } }
      });

      if (error) { say(error.message); return; }

      if (!data.session) {
        say("Check your email to confirm your account, then log in. Profile setup may need to be completed after confirmation.");
        return;
      }

      user = data.user;
      const { error: profileError } = await db.from("profiles")
        .upsert({ id: user.id, username });

      if (profileError) {
        say("Account created, but profile setup failed: " + profileError.message);
        return;
      }

      say("Welcome to Vibe!");
      showApp();
    });

    $("login").onclick = () => run(async () => {
      const { data, error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      if (error) { say(error.message); return; }
      user = data.user;
      showApp();
    });

    $("logout").onclick = () => run(async () => {
      if (messageSubscription) await db.removeChannel(messageSubscription);
      messageSubscription = null;
      const { error } = await db.auth.signOut();
      if (error) { say(error.message); return; }

      user = null;
      currentServer = null;
      currentChannel = null;
      showAuth();
    });

    async function loadServers() {
      if (!user) return;
      const { data, error } = await db.from("servers")
        .select("id,name,owner_id").order("name");

      if (error) { say("Server error: " + error.message); return; }

      $("servers").replaceChildren();
      $("serverIcons").replaceChildren();

      for (const server of data || []) {
        const item = document.createElement("button");
        item.className = "side-item";
        item.textContent = "🌐 " + server.name;
        item.onclick = () => run(() => selectServer(server));
        $("servers").appendChild(item);

        const icon = document.createElement("button");
        icon.className = "server-icon";
        icon.title = server.name;
        icon.textContent = initials(server.name);
        icon.onclick = () => run(() => selectServer(server));
        $("serverIcons").appendChild(icon);
      }

      $("sideHint").textContent = data.length
        ? "Select a server to see its channels."
        : "Create a server to start your community.";
    }

    async function createServer() {
      if (!user) return;
      const name = prompt("What should your server be called?");
      if (!name || !name.trim()) return;

      const { data, error } = await db.from("servers")
        .insert({ name: name.trim(), owner_id: user.id })
        .select().single();

      if (error) { alert("Couldn't create server: " + error.message); return; }

      // This membership insert relies on the current database policy.
      // Secure invitation and membership policies before public launch.
      const { error: memberError } = await db.from("server_members")
        .insert({ server_id: data.id, user_id: user.id });

      if (memberError) {
        alert("Server created, but membership failed: " + memberError.message);
        await loadServers();
        return;
      }

      await loadServers();
      await selectServer(data);
    }

    $("railAdd").onclick = () => run(createServer);
    $("sideAdd").onclick = () => run(createServer);

    async function selectServer(server) {
      currentServer = server;
      currentChannel = null;
      $("serverHeading").textContent = server.name;
      $("chatTitle").textContent = server.name;
      $("channels").replaceChildren();
      $("messages").classList.add("hidden");
      $("composer-wrap").classList.add("hidden");
      $("welcome").classList.remove("hidden");
      $("welcome").innerHTML =
        "<div class='big-hash'>#</div><h2>" +
        escapeHtml(server.name) +
        "</h2><p>Pick a channel or create one to get chatting.</p>";

      const { data, error } = await db.from("channels")
        .select("id,name,server_id").eq("server_id", server.id).order("name");

      if (error) { say("Channel error: " + error.message); return; }

      for (const channel of data || []) {
        const button = document.createElement("button");
        button.className = "side-item";
        button.textContent = "# " + channel.name;
        button.onclick = () => run(() => selectChannel(channel));
        $("channels").appendChild(button);
      }

      $("sideHint").textContent = data.length
        ? "Choose a channel to chat."
        : "No channels yet. Tap + beside Text channels.";
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    $("channelAdd").onclick = () => run(async () => {
      if (!currentServer) {
        alert("Choose a server first.");
        return;
      }

      const name = prompt("What should this channel be called?");
      if (!name || !name.trim()) return;

      const { data, error } = await db.from("channels")
        .insert({ name: name.trim(), server_id: currentServer.id })
        .select().single();

      if (error) { alert("Couldn't create channel: " + error.message); return; }

      await selectServer(currentServer);
      await selectChannel(data);
    });

    async function selectChannel(channel) {
      currentChannel = channel;
      $("chatTitle").textContent = channel.name;
      $("welcome").classList.add("hidden");
      $("messages").classList.remove("hidden");
      $("composer-wrap").classList.remove("hidden");
      $("messageInput").placeholder = "Message #" + channel.name;

      if (messageSubscription) await db.removeChannel(messageSubscription);

      await loadMessages();

      messageSubscription = db.channel("vibe-" + channel.id)
        .on("postgres_changes", {
          event: "INSERT", schema: "public", table: "messages",
          filter: "channel_id=eq." + channel.id
        }, () => loadMessages())
        .subscribe();
    }

    async function loadMessages() {
      if (!currentChannel) return;
      const channelId = currentChannel.id;

      const { data, error } = await db.from("messages")
        .select("id,user_id,content,created_at")
        .eq("channel_id", channelId)
        .order("created_at", { ascending: true }).limit(100);

      if (error) { say("Message error: " + error.message); return; }

      const ids = [...new Set((data || []).map(message => message.user_id))];
      let profiles = [];

      if (ids.length) {
        const result = await db.from("profiles")
          .select("id,username").in("id", ids);
        if (!result.error) profiles = result.data || [];
      }

      const names = Object.fromEntries(profiles.map(p => [p.id, p.username]));
      const box = $("messages");
      box.replaceChildren();

      for (const message of data || []) {
        const row = document.createElement("div");
        row.className = "message";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = initials(names[message.user_id] || "V");

        const body = document.createElement("div");
        body.className = "message-body";

        const top = document.createElement("div");
        top.className = "message-top";

        const name = document.createElement("strong");
        name.textContent = names[message.user_id] || "Vibe user";

        const time = document.createElement("time");
        time.textContent = message.created_at
          ? new Date(message.created_at).toLocaleString()
          : "";

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = message.content;

        top.append(name, time);
        body.append(top, text);
        row.append(avatar, body);
        box.appendChild(row);
      }

      box.scrollTop = box.scrollHeight;
    }

    $("send").onclick = () => run(async () => {
      if (!user || !currentChannel) return;

      const input = $("messageInput");
      const content = input.value.trim();
      if (!content) return;

      const { error } = await db.from("messages").insert({
        channel_id: currentChannel.id,
        user_id: user.id,
        content
      });

      if (error) { say("Couldn't send: " + error.message); return; }

      input.value = "";
      await loadMessages();
    });

    $("messageInput").addEventListener("keydown", event => {
      if (event.key === "Enter") $("send").click();
    });
  </script>
</body>
</html>
