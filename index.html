<!DOCTYPE html>
<html lang="en">
<head>
  <!-- VIBE SETTINGS -->
  <script>
    const SUPABASE_URL = "https://gxfhzqtlcexneuonrryl.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_EvJ8SO7DdOMKCNXenpxwBA_SXqO1jWl";
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171329">
  <title>Vibe - Chat Together</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #171329;
      color: white;
    }

    header {
      padding: 18px;
      background: #241b40;
      color: #c6a7ff;
      font-size: 27px;
      font-weight: bold;
    }

    main {
      max-width: 950px;
      margin: auto;
      padding: 15px;
    }

    .panel {
      background: #241f39;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    input, button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: none;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      background: #352d4d;
      color: white;
    }

    button {
      background: #a879ff;
      color: #171329;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #403656;
      color: white;
    }

    .hidden { display: none !important; }

    #layout {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
    }

    .item {
      padding: 12px;
      margin: 6px 0;
      background: #352d4d;
      border-radius: 9px;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .item:active { background: #574575; }

    #messages {
      height: 330px;
      overflow-y: auto;
      background: #171329;
      padding: 10px;
      border-radius: 9px;
    }

    .message {
      padding: 10px;
      margin-bottom: 8px;
      background: #352d4d;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .message small {
      display: block;
      color: #c6a7ff;
      margin-bottom: 5px;
    }

    #status {
      color: #d8c8ff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      #layout { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>💜 Vibe</header>

  <main>
    <p id="status">Welcome to Vibe!</p>

    <section id="auth" class="panel">
      <h2>Welcome to Vibe</h2>
      <p>Create an account or log in.</p>

      <input id="username" placeholder="Username (sign-up only)">
      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password"
             placeholder="Password (at least 8 characters)">

      <button id="signup">Create Account</button>
      <button id="login" class="secondary">Log In</button>
    </section>

    <section id="app" class="hidden">
      <section class="panel">
        <span id="who">Logged in</span>
        <button id="logout" class="secondary">Log Out</button>
      </section>

      <div id="layout">
        <div>
          <section class="panel">
            <h3>🌎 Servers</h3>
            <div id="servers"></div>

            <input id="serverName" placeholder="New server name">
            <button id="createServer">+ Create Server</button>
          </section>

          <section class="panel">
            <h3>💬 Channels</h3>
            <div id="channels"></div>

            <input id="channelName" placeholder="New channel name">
            <button id="createChannel">+ Create Channel</button>
          </section>
        </div>

        <section class="panel">
          <h3 id="chatTitle">Choose a channel</h3>
          <div id="messages"></div>

          <input id="messageInput" maxlength="2000"
                 placeholder="Type a message...">
          <button id="send">Send Message ➤</button>
        </section>
      </div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const say = text => $("status").textContent = text;

    let db = null;
    let user = null;
    let currentServer = null;
    let currentChannel = null;
    let messageSubscription = null;
    let busy = false;

    function setBusy(value) {
      busy = value;
      ["signup", "login", "createServer",
       "createChannel", "send"].forEach(id => {
        $(id).disabled = value;
      });
    }

    function showAuth() {
      $("auth").classList.remove("hidden");
      $("app").classList.add("hidden");
    }

    function showApp() {
      $("auth").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("who").textContent = "Logged in as " + (user.email || "Vibe user");
      loadServers();
    }

    async function run(action) {
      if (busy) return;
      setBusy(true);
      try {
        await action();
      } catch (error) {
        say(error.message || "Something went wrong.");
      } finally {
        setBusy(false);
      }
    }

    const configured =
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("/rest/v1") &&
      !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_") &&
      SUPABASE_PUBLISHABLE_KEY.length > 10;

    if (!configured) {
      say("Add your Supabase publishable key at the top of this file.");
    } else if (!window.supabase) {
      say("Supabase failed to load. Check your internet connection.");
    } else {
      db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      start();
    }

    async function start() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        say(error.message);
        return;
      }

      if (data.session) {
        user = data.session.user;
        showApp();
      } else {
        showAuth();
      }

      db.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_IN" && session) {
          user = session.user;
          showApp();
        }

        if (event === "SIGNED_OUT") {
          user = null;
          currentServer = null;
          currentChannel = null;
          showAuth();
        }
      });
    }

    $("signup").onclick = () => run(async () => {
      const username = $("username").value.trim();
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        say("Username must be 3-20 letters, numbers, or underscores.");
        return;
      }

      if (!email || password.length < 8) {
        say("Enter your email and a password of at least 8 characters.");
        return;
      }

      say("Creating account...");

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      if (error) {
        say(error.message);
        return;
      }

      if (!data.session) {
        say("Check your email to confirm your account, then log in. Your profile may need to be created after confirmation.");
        return;
      }

      user = data.user;

      const { error: profileError } = await db
        .from("profiles")
        .upsert({ id: user.id, username });

      if (profileError) {
        say("Account created, but profile setup failed: " + profileError.message);
        return;
      }

      say("Account created! Welcome to Vibe!");
      showApp();
    });

    $("login").onclick = () => run(async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      const { data, error } = await db.auth.signInWithPassword({
        email, password
      });

      if (error) {
        say(error.message);
        return;
      }

      user = data.user;
      say("Welcome back!");
      showApp();
    });

    $("logout").onclick = () => run(async () => {
      if (messageSubscription) {
        await db.removeChannel(messageSubscription);
        messageSubscription = null;
      }

      const { error } = await db.auth.signOut();

      if (error) {
        say(error.message);
        return;
      }

      user = null;
      currentServer = null;
      currentChannel = null;
      $("messages").replaceChildren();
      $("channels").replaceChildren();
      $("servers").replaceChildren();
      showAuth();
      say("You are logged out.");
    });

    async function loadServers() {
      if (!user) return;

      const { data, error } = await db
        .from("servers")
        .select("id,name,owner_id")
        .order("name");

      if (error) {
        say("Couldn't load servers: " + error.message);
        return;
      }

      const box = $("servers");
      box.replaceChildren();

      for (const server of data || []) {
        const el = document.createElement("div");
        el.className = "item";
        el.textContent = "🌎 " + server.name;
        el.onclick = () => run(() => selectServer(server));
        box.appendChild(el);
      }
    }

    $("createServer").onclick = () => run(async () => {
      const name = $("serverName").value.trim();

      if (!name) {
        say("Type a server name first.");
        return;
      }

      const { data, error } = await db
        .from("servers")
        .insert({ name, owner_id: user.id })
        .select()
        .single();

      if (error) {
        say("Couldn't create server: " + error.message);
        return;
      }

      // This depends on your current server_members policy.
      // Secure invitations/membership before public launch.
      const { error: memberError } = await db
        .from("server_members")
        .insert({ server_id: data.id, user_id: user.id });

      $("serverName").value = "";

      if (memberError) {
        say("Server created, but membership failed: " + memberError.message);
        await loadServers();
        return;
      }

      await loadServers();
      await selectServer(data);
      say("Server created!");
    });

    async function selectServer(server) {
      currentServer = server;
      currentChannel = null;
      $("chatTitle").textContent = server.name;
      $("messages").replaceChildren();
      $("channels").replaceChildren();

      const { data, error } = await db
        .from("channels")
        .select("id,name,server_id")
        .eq("server_id", server.id)
        .order("name");

      if (error) {
        say("Couldn't load channels: " + error.message);
        return;
      }

      for (const channel of data || []) {
        const el = document.createElement("div");
        el.className = "item";
        el.textContent = "# " + channel.name;
        el.onclick = () => run(() => selectChannel(channel));
        $("channels").appendChild(el);
      }
    }

    $("createChannel").onclick = () => run(async () => {
      if (!currentServer) {
        say("Choose a server first.");
        return;
      }

      const name = $("channelName").value.trim();

      if (!name) {
        say("Type a channel name first.");
        return;
      }

      const { data, error } = await db
        .from("channels")
        .insert({
          name,
          server_id: currentServer.id
        })
        .select()
        .single();

      if (error) {
        say("Couldn't create channel: " + error.message);
        return;
      }

      $("channelName").value = "";
      await selectServer(currentServer);
      await selectChannel(data);
      say("Channel created!");
    });

    async function selectChannel(channel) {
      currentChannel = channel;
      $("chatTitle").textContent =
        currentServer.name + " / #" + channel.name;

      if (messageSubscription) {
        await db.removeChannel(messageSubscription);
        messageSubscription = null;
      }

      await loadMessages();

      messageSubscription = db
        .channel("vibe-" + channel.id)
        .on("postgres_changes", {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter: "channel_id=eq." + channel.id
        }, () => loadMessages())
        .subscribe();
    }

    async function loadMessages() {
      if (!currentChannel) return;

      const channelId = currentChannel.id;

      const { data, error } = await db
        .from("messages")
        .select("id,user_id,content,created_at")
        .eq("channel_id", channelId)
        .order("created_at", { ascending: true })
        .limit(100);

      if (error) {
        say("Couldn't load messages: " + error.message);
        return;
      }

      const userIds = [...new Set((data || []).map(m => m.user_id))];
      let profiles = [];

      if (userIds.length) {
        const result = await db
          .from("profiles")
          .select("id,username")
          .in("id", userIds);

        if (!result.error) profiles = result.data || [];
      }

      const names = Object.fromEntries(
        profiles.map(p => [p.id, p.username])
      );

      const box = $("messages");
      box.replaceChildren();

      for (const message of data || []) {
        const item = document.createElement("div");
        item.className = "message";

        const name = document.createElement("small");
        name.textContent = names[message.user_id] || "Vibe user";

        const content = document.createElement("div");
        content.textContent = message.content;

        item.append(name, content);
        box.appendChild(item);
      }

      box.scrollTop = box.scrollHeight;
    }

    $("send").onclick = () => run(async () => {
      if (!user || !currentChannel) {
        say("Choose a channel before sending a message.");
        return;
      }

      const input = $("messageInput");
      const content = input.value.trim();

      if (!content) return;

      const { error } = await db.from("messages").insert({
        channel_id: currentChannel.id,
        user_id: user.id,
        content
      });

      if (error) {
        say("Couldn't send message: " + error.message);
        return;
      }

      input.value = "";
      await loadMessages();
    });

    $("messageInput").addEventListener("keydown", event => {
      if (event.key === "Enter") $("send").click();
    });
  </script>
</body>
</html>
